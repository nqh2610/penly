name = "penly-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# KV binding cho Penly Keys
# id lấy từ Cloudflare dashboard > Workers & Pages > KV > PENLY_KEYS > View details
[[kv_namespaces]]
binding = "PENLY_KEYS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# ADMIN_PASSWORD và GROQ_KEY được set qua Cloudflare dashboard > Workers > Settings > Variables
# KHÔNG đặt secret ở đây vì file này sẽ lên GitHub
